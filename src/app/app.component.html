<a class="skip" href="#work">Skip to content</a>
<div class="progress" [style.transform]="'scaleX(' + progress + ')'" aria-hidden="true"></div>

<nav class="nav" [class.is-scrolled]="scrolled" [class.is-open]="menuOpen" aria-label="Main">
  <a class="nav__brand" href="#top" (click)="menuOpen = false">
    <span class="nav__mark" aria-hidden="true">ds</span>
    <span class="nav__name">Diogo Sousa</span>
  </a>

  <ul class="nav__links">
    @for (id of sections; track id; let i = $index) {
      <li>
        <a [href]="'#' + id" [class.is-current]="current === id" [attr.aria-current]="current === id ? 'true' : null" (click)="menuOpen = false">
          <span class="mono">0{{ i + 1 }}</span>{{ label(id) }}
        </a>
      </li>
    }
  </ul>

  <div class="nav__tools">
    <button class="nav__lang mono" type="button" (click)="i18n.toggle()" [attr.aria-label]="i18n.t().palette.switchLang">
      <span [class.is-on]="i18n.lang() === 'pt'">PT</span><span [class.is-on]="i18n.lang() === 'en'">EN</span>
    </button>
    <button class="nav__k mono" type="button" (click)="palette.show()" [attr.aria-label]="i18n.t().hero.hint">
      <kbd>{{ isMac ? '⌘' : 'Ctrl' }}</kbd><kbd>K</kbd>
    </button>
    <button class="nav__burger" type="button" (click)="menuOpen = !menuOpen" [attr.aria-expanded]="menuOpen" [attr.aria-label]="i18n.t().nav.menu">
      <span></span><span></span>
    </button>
  </div>
</nav>

<main>
  <app-hero />
  <app-work />
  <app-career />
  <app-about />
  <app-contact />
</main>

<app-palette />
