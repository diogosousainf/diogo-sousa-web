@if (open()) {
  <div class="palette" (click)="close()">
    <div class="palette__box" role="dialog" aria-modal="true" [attr.aria-label]="i18n.t().palette.placeholder" (click)="$event.stopPropagation()">
      <div class="palette__search">
        <span class="mono" aria-hidden="true">⌘K</span>
        <input #input type="text" [placeholder]="i18n.t().palette.placeholder"
               [value]="query()" (input)="onInput(input.value)" (keydown)="onKey($event)"
               role="combobox" aria-expanded="true" aria-controls="palette-list"
               [attr.aria-activedescendant]="'cmd-' + active()">
        <kbd class="mono">esc</kbd>
      </div>
      <ul class="palette__list" id="palette-list" role="listbox">
        @for (c of results(); track c.label; let i = $index) {
          @if (i === 0 || results()[i - 1].group !== c.group) {
            <li class="palette__group mono" role="presentation">{{ c.group }}</li>
          }
          <li class="palette__item" role="option" [id]="'cmd-' + i"
              [class.is-active]="i === active()" [attr.aria-selected]="i === active()"
              (pointermove)="active.set(i)" (click)="exec(c)">
            <span>{{ c.label }}</span>
            <span class="mono palette__hint">{{ c.hint }}</span>
          </li>
        } @empty {
          <li class="palette__empty">{{ i18n.t().palette.empty }}</li>
        }
      </ul>
    </div>
  </div>
}
